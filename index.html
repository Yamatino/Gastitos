<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gastitos</title>
    <meta name="description" content="Tu tracker de gastos personales" />

    <!-- Installable app (Add to home screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser/status bar color; App.tsx updates it when the theme changes -->
    <meta name="theme-color" content="#101115" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gastitos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Apply the saved theme before first paint to avoid a dark flash in light mode
      try {
        var light = JSON.parse(localStorage.getItem('gastitos-user-storage') || '{}').state?.isLightMode
        document.documentElement.classList.add(light ? 'light' : 'dark')
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f6f9')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
